services:
  antigravity2api:
    image: ghcr.io/henrynitrogen/antigravity2api:latest
    container_name: antigravity2api
    restart: always
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      # 👇 从 Mac 桌面端点击「复制 Refresh Token」，粘贴在此处：
      - REFRESH_TOKEN=在这里粘贴你的_REFRESH_TOKEN
      - PROJECT_ID=aicode-consumers
      - DEFAULT_MODEL=gemini-3.8-flash-tiered
      # 可选：API 访问密码 (客户端请求需带 Bearer <KEY>)
      # - API_KEY=jerryisafemboy
      # 可选：如果服务器位于中国大陆，需配置出海代理连接 Google:
      # - PROXY_URL=http://host.docker.internal:7890

  # 🤖 Watchtower: 自动更新守护进程
  # 每隔 120 秒自动检查 GitHub Container Registry (ghcr.io)
  # 一旦检测到有新的 Docker 镜像推上去，自动在后台拉取并无缝重启 antigravity2api
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true                # 更新后自动清理无用的旧镜像，不占服务器硬盘
      - WATCHTOWER_POLL_INTERVAL=120           # 检查间隔时间（秒），这里设为 2 分钟检查一次
      - WATCHTOWER_INCLUDE_RESTARTING=true
    command: antigravity2api                   # 只监控更新 antigravity2api，不影响服务器上的其他容器
