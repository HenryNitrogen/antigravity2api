<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity2Api - 控制台</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d30;
      --border: #222f4c;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code-bg: #060911;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1050px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand h1 { font-size: 22px; font-weight: 700; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge.online { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    .badge.offline { background: rgba(245, 158, 11, 0.2); color: var(--warning); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .card-title { font-size: 16px; font-weight: 600; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center; }

    .info-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .info-label { color: var(--text-muted); }
    .info-val { font-family: monospace; font-weight: 600; }

    .btn { background: var(--accent); color: white; border: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #1e293b; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: #059669; }
    .btn-success:hover { background: #047857; }

    input, select, textarea { width: 100%; background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .chat-box { height: 260px; overflow-y: auto; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 12px; font-size: 14px; line-height: 1.5; }
    .thought-bubble { background: rgba(59, 130, 246, 0.1); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 4px; font-size: 12px; color: #93c5fd; white-space: pre-wrap; font-family: monospace; max-height: 100px; overflow-y: auto; }
    .answer-bubble { white-space: pre-wrap; color: #f8fafc; }

    .log-box { height: 160px; overflow-y: auto; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #94a3b8; display: flex; flex-direction: column; gap: 4px; }
    .log-line { display: flex; gap: 10px; }
    .log-time { color: #64748b; }
    .log-msg { color: #e2e8f0; }

    .code-pill { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; color: #60a5fa; cursor: pointer; }
    .code-pill:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <span style="font-size: 26px;">🪐</span>
        <div>
          <h1>Antigravity2Api</h1>
          <p style="font-size: 12px; color: var(--text-muted);">OpenAI-Compatible Reverse Proxy Gateway</p>
        </div>
      </div>
      <div>
        <span id="status-badge" class="badge offline">检查状态中...</span>
      </div>
    </header>

    <div class="grid">
      <!-- 状态与连接 -->
      <div class="card">
        <div class="card-title">
          <span>📡 服务状态与端点</span>
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="fetchStatus()">刷新</button>
        </div>

        <div>
          <div class="info-row">
            <span class="info-label">Base URL (OpenAI 格式):</span>
            <span class="info-val code-pill" onclick="copyBaseURL()" id="base-url-text">http://localhost:8080/v1</span>
          </div>
          <div class="info-row">
            <span class="info-label">Google 账号:</span>
            <span class="info-val" id="user-email">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Companion Project ID:</span>
            <span class="info-val" id="project-id">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Token 状态:</span>
            <span class="info-val" id="token-status">未检测</span>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-top: auto;">
          <button class="btn btn-success" style="flex: 1;" onclick="startOAuth()">🔑 Google 登录授权</button>
          <button class="btn btn-secondary" style="flex: 1;" onclick="copyBaseURL()">📋 复制 Base URL</button>
        </div>
      </div>

      <!-- 参数配置 -->
      <div class="card">
        <div class="card-title">⚙️ 服务配置</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">端口 (Port):</label>
            <input type="number" id="cfg-port" placeholder="8080">
          </div>
          <div>
            <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">API Key (可选，留空则不验证):</label>
            <input type="text" id="cfg-apikey" placeholder="sk-antigravity-...">
          </div>
          <div>
            <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">科学上网代理地址 (如 http://127.0.0.1:7890):</label>
            <input type="text" id="cfg-proxy" placeholder="http://127.0.0.1:7890">
          </div>
          <div>
            <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 4px;">思维链 (Thinking) 输出格式:</label>
            <select id="cfg-thinking">
              <option value="reasoning_content">reasoning_content (DeepSeek / CherryStudio / NextChat 标准)</option>
              <option value="think_tag">&lt;think&gt;...&lt;/think&gt; 文本标签</option>
              <option value="both">两者同时输出</option>
            </select>
          </div>
        </div>
        <button class="btn" onclick="saveConfig()">保存配置</button>
      </div>
    </div>

    <!-- 在线测试 -->
    <div class="card">
      <div class="card-title">
        <span>🧪 在线对话测试</span>
        <select id="test-model" style="width: auto; padding: 4px 8px; font-size: 12px;">
          <option value="gemini-3.8-flash">Gemini 3.8 Flash (High) - 最新主力</option>
          <option value="gemini-3.7-flash">Gemini 3.7 Flash (Medium)</option>
          <option value="gemini-3.6-flash">Gemini 3.6 Flash (Medium)</option>
          <option value="gemini-3.1-pro">Gemini 3.1 Pro (Low)</option>
          <option value="gpt-4o">gpt-4o (别名映射)</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro (旧版兼容)</option>
        </select>
      </div>

      <div class="chat-box" id="chat-output">
        <div style="color: #64748b; text-align: center; margin-top: 80px;">输入提示词测试流式响应与思维链输出...</div>
      </div>

      <div style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="输入测试问题，如：请写一首关于宇宙的诗，并展示思考过程..." onkeydown="if(event.key==='Enter') sendChat()">
        <button class="btn" style="width: 100px;" id="send-btn" onclick="sendChat()">发送</button>
      </div>
    </div>

    <!-- 实时调用日志 -->
    <div class="card">
      <div class="card-title">📝 请求日志</div>
      <div class="log-box" id="log-box">
        <div class="log-line"><span class="log-time">[Init]</span><span class="log-msg">客户端连接成功，等待请求...</span></div>
      </div>
    </div>
  </div>

  <script>
    const baseURL = window.location.origin + "/v1";
    document.getElementById("base-url-text").textContent = baseURL;

    async function fetchStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();
        
        const badge = document.getElementById("status-badge");
        if (data.authenticated) {
          badge.className = "badge online";
          badge.textContent = "🟢 运行中 (已授权)";
          document.getElementById("token-status").textContent = "有效 (自动续期)";
          document.getElementById("token-status").style.color = "var(--success)";
        } else {
          badge.className = "badge offline";
          badge.textContent = "🟡 未授权 Google";
          document.getElementById("token-status").textContent = "需要登录";
          document.getElementById("token-status").style.color = "var(--warning)";
        }

        document.getElementById("user-email").textContent = data.user_email || "未绑定";
        document.getElementById("project-id").textContent = data.project_id || "未获取";
        
        document.getElementById("cfg-port").value = data.port || 8080;
        document.getElementById("cfg-apikey").value = data.api_key || "";
        document.getElementById("cfg-proxy").value = data.proxy_url || "";
        document.getElementById("cfg-thinking").value = data.thinking_format || "reasoning_content";
      } catch (err) {
        console.error(err);
      }
    }

    async function startOAuth() {
      try {
        const res = await fetch("/auth/login-url");
        const data = await res.json();
        if (data.url) {
          window.open(data.url, "_blank");
          pollAuthStatus();
        }
      } catch (err) {
        alert("获取登录链接失败: " + err);
      }
    }

    function pollAuthStatus() {
      const interval = setInterval(async () => {
        const res = await fetch("/api/status");
        const data = await res.json();
        if (data.authenticated) {
          clearInterval(interval);
          fetchStatus();
          alert("🎉 Google 账号授权成功！");
        }
      }, 2000);
      setTimeout(() => clearInterval(interval), 120000);
    }

    async function saveConfig() {
      const body = {
        port: parseInt(document.getElementById("cfg-port").value) || 8080,
        api_key: document.getElementById("cfg-apikey").value.trim(),
        proxy_url: document.getElementById("cfg-proxy").value.trim(),
        thinking_format: document.getElementById("cfg-thinking").value
      };

      try {
        const res = await fetch("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          alert("配置已更新！(若修改了端口，重启后生效)");
          fetchStatus();
        } else {
          alert("保存失败");
        }
      } catch (err) {
        alert("保存出错: " + err);
      }
    }

    function copyBaseURL() {
      navigator.clipboard.writeText(baseURL);
      alert("已复制 Base URL: " + baseURL);
    }

    async function sendChat() {
      const input = document.getElementById("chat-input");
      const prompt = input.value.trim();
      if (!prompt) return;

      const model = document.getElementById("test-model").value;
      const chatBox = document.getElementById("chat-output");
      chatBox.innerHTML = "";

      const thoughtDiv = document.createElement("div");
      thoughtDiv.className = "thought-bubble";
      thoughtDiv.style.display = "none";
      chatBox.appendChild(thoughtDiv);

      const answerDiv = document.createElement("div");
      answerDiv.className = "answer-bubble";
      chatBox.appendChild(answerDiv);

      input.value = "";
      const sendBtn = document.getElementById("send-btn");
      sendBtn.disabled = true;

      try {
        const response = await fetch("/v1/chat/completions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: model,
            stream: true,
            messages: [{ role: "user", content: prompt }]
          })
        });

        if (!response.ok) {
          const errText = await response.text();
          answerDiv.textContent = `❌ 请求错误 (${response.status}): ${errText}`;
          sendBtn.disabled = false;
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed || !trimmed.startsWith("data:")) continue;
            const dataStr = trimmed.slice(5).trim();
            if (dataStr === "[DONE]") continue;

            try {
              const chunk = JSON.parse(dataStr);
              const delta = chunk.choices[0]?.delta || {};

              if (delta.reasoning_content) {
                thoughtDiv.style.display = "block";
                thoughtDiv.textContent += delta.reasoning_content;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
              if (delta.content) {
                answerDiv.textContent += delta.content;
                chatBox.scrollTop = chatBox.scrollHeight;
              }
            } catch (e) {}
          }
        }
      } catch (err) {
        answerDiv.textContent = "请求失败: " + err;
      } finally {
        sendBtn.disabled = false;
        fetchLogs();
      }
    }

    async function fetchLogs() {
      try {
        const res = await fetch("/api/logs");
        const logs = await res.json();
        const logBox = document.getElementById("log-box");
        logBox.innerHTML = "";
        logs.forEach(item => {
          const row = document.createElement("div");
          row.className = "log-line";
          row.innerHTML = `<span class="log-time">[${item.time}]</span><span class="log-msg">${item.method} ${item.path} ${item.model || ""} - ${item.status} (${item.duration}ms)</span>`;
          logBox.appendChild(row);
        });
        logBox.scrollTop = logBox.scrollHeight;
      } catch (e) {}
    }

    fetchStatus();
    setInterval(fetchLogs, 4000);
  </script>
</body>
</html>
